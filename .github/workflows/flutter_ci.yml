name: Flutter CI

# Déclenchement du workflow à chaque push ou pull request sur les branches principales
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Récupération du code source
      - uses: actions/checkout@v3

      # Installation de Flutter
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # Installation des dépendances
      - name: Install dependencies
        run: flutter pub get

      # Analyse statique du code (Lints)
      - name: Analyze code
        run: flutter analyze

      # Exécution de la suite de tests
      - name: Run tests
        run: flutter test
